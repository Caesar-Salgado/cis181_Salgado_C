<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIS 181 Form Demo</title>
    <link rel="stylesheet" href="forms.css">
</head>

<body>
    <main>
        <h1>CIS 181 Course Interest Form</h1>

        <p>
            This sample form shows how a website can collect information from
            visitors. Each form control has a label so users know what to enter.
        </p>

        <!--
            action="#" keeps this classroom demo on the same page.
            A real website would send the form data to a server for processing.
        -->
        
        <form>
            <fieldset>
                <legend>Course Interest</legend>
                <label for="topic">Which topic interests you most?</label>
                <select id="topic" name="topic">
                    <option value="Art">Art</option>
                    <option value="Math">Math</option>
                    <option value="History">History</option>
                </select>

                <p class="question">Which learning format do you perfer?</p>
                <div class="choice-group">
                    <input type="radio" id="in-person" name="format">
                    <label for="in-person">In person</label>

                    <input type="radio" id="online" name="format">
                    <label for="online">Online</label>
                </div>

                <label for="questions">Questions or Comments</label>
                <textarea id="Questions" name="questions"></textarea>

                <div class="choice-group">
                    <input type="checkbox" id="checkbox">
                    <p for="checkbox">Send me course updates</p>
                </div>
            </fieldset>
        </form>
    </main>
</body>
</html>
